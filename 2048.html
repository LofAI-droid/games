<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>2048</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #faf8ef;
    --panel: #bbada0;
    --cell: #cdc1b4;
    --text: #3c3a32;
    --muted: #7a736a;
    --accent: #8f7a66;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --panel: #3a352e;
      --cell: #2b271f;
      --text: #f2ece2;
      --muted: #b3a998;
      --accent: #b39c82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --panel: #3a352e;
    --cell: #2b271f;
    --text: #f2ece2;
    --muted: #b3a998;
    --accent: #b39c82;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 10px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #board {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 12px;
    background: var(--panel);
    padding: 3%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3%;
    box-shadow: 0 4px 18px rgba(0,0,0,0.2);
  }
  .cell {
    background: var(--cell);
    border-radius: 8px;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 800;
    transition: top 0.12s ease, left 0.12s ease;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,255,255,0.75);
    color: #3c3a32;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    z-index: 10;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #overlay { background: rgba(23,20,15,0.85); color: #f2ece2; }
  }
  :root[data-theme="dark"] #overlay { background: rgba(23,20,15,0.85); color: #f2ece2; }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>🔢 2048</h1>
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Beste: <span id="best">0</span></div>
    </div>
    <div id="board">
      <div id="overlay">
        <h2 id="overlayTitle">Veeg om te schuiven</h2>
        <p id="overlayText">Veeg omhoog, omlaag, links of rechts om de tegels te schuiven. Twee gelijke tegels worden samengevoegd. Haal 2048!</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Veeg over het bord om te spelen</div>
  </div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const SIZE = 4;
  let grid, score, best, tileEls, state;

  try {
    const stored = localStorage.getItem('2048-best');
    best = stored ? parseInt(stored, 10) || 0 : 0;
  } catch(e) { best = 0; }
  bestEl.textContent = best;

  const colors = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
    32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
    512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
  };
  function tileColor(v) { return colors[v] || '#3c3a32'; }
  function tileTextColor(v) { return v <= 4 ? '#776e65' : '#ffffff'; }

  // background cells (static)
  for (let i = 0; i < SIZE*SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    board.appendChild(c);
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] === 0) empties.push([r,c]);
    if (empties.length === 0) return false;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  function renderGrid() {
    // remove old tile elements
    board.querySelectorAll('.tile').forEach(t => t.remove());
    const rect = board.getBoundingClientRect();
    const pad = rect.width * 0.03;
    const gap = rect.width * 0.03;
    const cellSize = (rect.width - pad*2 - gap*3) / SIZE;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = v;
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = (pad + c*(cellSize+gap)) + 'px';
        tile.style.top = (pad + r*(cellSize+gap)) + 'px';
        tile.style.background = tileColor(v);
        tile.style.color = tileTextColor(v);
        tile.style.fontSize = (v < 100 ? cellSize*0.42 : v < 1000 ? cellSize*0.34 : cellSize*0.26) + 'px';
        board.appendChild(tile);
      }
    }
  }

  function slideRowLeft(row) {
    const vals = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < vals.length - 1; i++) {
      if (vals[i] === vals[i+1]) {
        vals[i] *= 2;
        gained += vals[i];
        vals.splice(i+1, 1);
      }
    }
    while (vals.length < SIZE) vals.push(0);
    return { vals, gained };
  }

  function rotateGridCW(g) {
    const n = g.length;
    const res = emptyGrid();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) res[c][n-1-r] = g[r][c];
    return res;
  }

  function move(dir) {
    // dir: 'left','right','up','down'
    let g = grid.map(row => row.slice());
    let rotations = 0;
    if (dir === 'up') rotations = 3;
    else if (dir === 'right') rotations = 2;
    else if (dir === 'down') rotations = 1;
    for (let i = 0; i < rotations; i++) g = rotateGridCW(g);

    let moved = false;
    let gainedTotal = 0;
    const newG = [];
    for (let r = 0; r < SIZE; r++) {
      const { vals, gained } = slideRowLeft(g[r]);
      gainedTotal += gained;
      if (vals.join(',') !== g[r].join(',')) moved = true;
      newG.push(vals);
    }
    let finalG = newG;
    for (let i = 0; i < (4 - rotations) % 4; i++) finalG = rotateGridCW(finalG);

    if (moved) {
      grid = finalG;
      score += gainedTotal;
      scoreEl.textContent = String(score);
      addRandomTile();
      renderGrid();
      checkGameOver();
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE-1 && grid[r][c] === grid[r][c+1]) return true;
        if (r < SIZE-1 && grid[r][c] === grid[r+1][c]) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] === 2048) return win();
    if (!canMove()) endGame();
  }

  function win() {
    state = 'over';
    saveBest();
    overlayTitle.textContent = 'Je hebt gewonnen! 🎉';
    overlayText.textContent = 'Score: ' + score + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('2048-best', String(best)); } catch(e) {}
    }
  }

  function endGame() {
    state = 'over';
    saveBest();
    overlayTitle.textContent = 'Game over!';
    overlayText.textContent = 'Score: ' + score + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    scoreEl.textContent = '0';
    state = 'playing';
    addRandomTile();
    addRandomTile();
    renderGrid();
    overlay.classList.add('hidden');
  }

  // swipe handling
  let touchStartX = 0, touchStartY = 0, touching = false;
  board.addEventListener('touchstart', function(e){
    if (state !== 'playing') return;
    touching = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  board.addEventListener('touchmove', function(e){
    if (touching) e.preventDefault();
  }, { passive: false });
  board.addEventListener('touchend', function(e){
    if (!touching || state !== 'playing') return;
    touching = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if (Math.max(absX, absY) < threshold) return;
    if (absX > absY) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  });

  // keyboard for desktop testing
  document.addEventListener('keydown', function(e){
    if (state !== 'playing') return;
    if (e.key === 'ArrowLeft') move('left');
    else if (e.key === 'ArrowRight') move('right');
    else if (e.key === 'ArrowUp') move('up');
    else if (e.key === 'ArrowDown') move('down');
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });

  window.addEventListener('resize', function(){ if (state === 'playing') renderGrid(); });
})();
</script>
</body>
</html>
