<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Slang</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #eef7f0;
    --panel: #16281f;
    --grid: #1e3527;
    --snake: #4dd4ac;
    --snakehead: #2fae87;
    --food: #ff6b6b;
    --text: #1c2b21;
    --muted: #5c7267;
    --accent: #2fae87;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1712;
      --text: #e8f5ee;
      --muted: #9db6a9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1712;
    --text: #e8f5ee;
    --muted: #9db6a9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 10px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #canvasBox {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; color: #e8f5ee; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>🐍 Slang</h1>
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Beste: <span id="best">0</span></div>
    </div>
    <div id="canvasBox">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay">
        <h2 id="overlayTitle">Veeg om te sturen</h2>
        <p id="overlayText">Veeg omhoog, omlaag, links of rechts om de slang te sturen. Eet het rode bolletje en groei, maar bots niet tegen jezelf of de rand.</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Veeg over het scherm om van richting te veranderen</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const COLS = 20, ROWS = 20;
  const W = canvas.width, H = canvas.height;
  const cell = W / COLS;

  let best = 0;
  try {
    const stored = localStorage.getItem('slang-best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch(e) {}
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, state, stepMs, lastStep;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    stepMs = 150;
    lastStep = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    let ok = false;
    while (!ok) {
      const fx = Math.floor(Math.random()*COLS);
      const fy = Math.floor(Math.random()*ROWS);
      if (!snake.some(s => s.x===fx && s.y===fy)) {
        food = {x:fx,y:fy};
        ok = true;
      }
    }
  }

  function startGame() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    lastStep = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('slang-best', String(best)); } catch(e) {}
    }
    overlayTitle.textContent = 'Game over!';
    overlayText.textContent = 'Score: ' + score + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  function step() {
    // prevent reversing directly into self
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
      dir = nextDir;
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame(); return;
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame(); return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = String(score);
      stepMs = Math.max(70, 150 - score * 3);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#16281f';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i=0;i<=COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,H); ctx.stroke();
    }
    for (let j=0;j<=ROWS;j++){
      ctx.beginPath(); ctx.moveTo(0,j*cell); ctx.lineTo(W,j*cell); ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ff6b6b';
    const fpad = cell*0.15;
    ctx.beginPath();
    ctx.arc(food.x*cell+cell/2, food.y*cell+cell/2, cell/2-fpad, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach((s,i) => {
      ctx.fillStyle = i === 0 ? '#2fae87' : '#4dd4ac';
      const pad = cell*0.08;
      roundRect(ctx, s.x*cell+pad, s.y*cell+pad, cell-pad*2, cell-pad*2, 5);
      ctx.fill();
    });
  }

  function roundRect(ctx,x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(ts) {
    if (state !== 'playing') return;
    if (ts - lastStep >= stepMs) {
      step();
      lastStep = ts;
    }
    if (state === 'playing') {
      draw();
      requestAnimationFrame(loop);
    }
  }

  // swipe controls
  let sx=0, sy=0, active=false;
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    active = true;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', function(e){
    if (!active) return;
    active = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX,absY) < 18) return;
    if (absX > absY) nextDir = { x: dx>0?1:-1, y:0 };
    else nextDir = { x:0, y: dy>0?1:-1 };
  });

  document.addEventListener('keydown', function(e){
    if (state !== 'playing') return;
    if (e.key==='ArrowLeft') nextDir={x:-1,y:0};
    else if (e.key==='ArrowRight') nextDir={x:1,y:0};
    else if (e.key==='ArrowUp') nextDir={x:0,y:-1};
    else if (e.key==='ArrowDown') nextDir={x:0,y:1};
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });

  reset();
  draw();
})();
</script>
</body>
</html>
