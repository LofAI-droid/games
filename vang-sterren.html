<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Vang de Sterren</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #f5f1ea;
    --panel: #ffffff;
    --text: #201c2b;
    --muted: #6b6478;
    --accent: #7c5cff;
    --accent2: #ffb703;
    --bad: #ff4d6d;
    --sky1: #1b1035;
    --sky2: #3d2a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14101e;
      --panel: #1e1830;
      --text: #f0edf7;
      --muted: #a89fc0;
      --accent: #9b82ff;
      --accent2: #ffcb4d;
      --bad: #ff6b85;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14101e;
    --panel: #1e1830;
    --text: #f0edf7;
    --muted: #a89fc0;
    --accent: #9b82ff;
    --accent2: #ffcb4d;
    --bad: #ff6b85;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 8px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #lives { font-size: 1rem; }
  #canvasBox {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 4px 18px rgba(0,0,0,0.2);
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; color: #e7e2f2; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>⭐ Vang de Sterren</h1>
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div id="lives">❤️❤️❤️</div>
      <div>Beste: <span id="best">0</span></div>
    </div>
    <div id="canvasBox">
      <canvas id="game" width="480" height="640"></canvas>
      <div id="overlay">
        <h2 id="overlayTitle">Sleep om te vangen</h2>
        <p id="overlayText">Vang sterren, ontwijk bommen. Sleep je vinger over het scherm om de mand te bewegen.</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Sleep links/rechts om de mand te bewegen</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const livesEl = document.getElementById('lives');

  const W = canvas.width, H = canvas.height;

  let best = 0;
  try {
    const stored = localStorage.getItem('vangdesterren-best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch (e) {}
  bestEl.textContent = best;

  let state = 'ready';
  let basket, items, score, lives, frame, spawnTimer, speedMul;

  function reset() {
    basket = { x: W/2 - 45, w: 90, h: 22, y: H - 50 };
    items = [];
    score = 0;
    lives = 3;
    frame = 0;
    spawnTimer = 0;
    speedMul = 1;
    scoreEl.textContent = '0';
    updateLives();
  }

  function updateLives() {
    livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  }

  function startGame() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('vangdesterren-best', String(best)); } catch (e) {}
    }
    overlayTitle.textContent = 'Game over!';
    overlayText.textContent = 'Score: ' + score + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  function spawnItem() {
    const isBomb = Math.random() < 0.22;
    items.push({
      x: 24 + Math.random() * (W - 48),
      y: -20,
      r: isBomb ? 15 : 13,
      vy: (2.4 + Math.random() * 1.6) * speedMul,
      bomb: isBomb,
      spin: Math.random() * Math.PI * 2
    });
  }

  function update() {
    frame++;
    speedMul = 1 + Math.min(1.2, score * 0.01);

    spawnTimer -= 1;
    if (spawnTimer <= 0) {
      spawnItem();
      spawnTimer = Math.max(22, 42 - score * 0.4);
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy;
      it.spin += 0.06;

      // catch check
      if (
        it.y + it.r >= basket.y &&
        it.y - it.r <= basket.y + basket.h &&
        it.x >= basket.x - it.r &&
        it.x <= basket.x + basket.w + it.r
      ) {
        if (it.bomb) {
          lives--;
          updateLives();
          items.splice(i, 1);
          if (lives <= 0) { gameOver(); return; }
        } else {
          score++;
          scoreEl.textContent = String(score);
          items.splice(i, 1);
        }
        continue;
      }

      // missed a star -> lose a life; missed a bomb -> fine
      if (it.y - it.r > H) {
        if (!it.bomb) {
          lives--;
          updateLives();
          if (lives <= 0) { items.splice(i,1); gameOver(); return; }
        }
        items.splice(i, 1);
      }
    }
  }

  function drawStar(cx, cy, r, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const ang = (Math.PI * 2 / 5) * i - Math.PI/2;
      const ang2 = ang + Math.PI/5;
      ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      ctx.lineTo(Math.cos(ang2) * (r*0.42), Math.sin(ang2) * (r*0.42));
    }
    ctx.closePath();
    ctx.fillStyle = '#ffcb4d';
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#1b1035');
    g.addColorStop(1, '#3d2a6b');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // twinkling background stars
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137) % W;
      const sy = (i * 91 + frame*0.2) % H;
      ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(i + frame*0.02));
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // items
    items.forEach(it => {
      if (it.bomb) {
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
        ctx.fillStyle = '#ff4d6d';
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('!', it.x, it.y+5);
      } else {
        drawStar(it.x, it.y, it.r, it.spin);
      }
    });

    // basket
    ctx.fillStyle = '#7c5cff';
    ctx.beginPath();
    const bx = basket.x, by = basket.y, bw = basket.w, bh = basket.h;
    ctx.moveTo(bx, by);
    ctx.lineTo(bx+bw, by);
    ctx.lineTo(bx+bw-8, by+bh);
    ctx.lineTo(bx+8, by+bh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function loop() {
    if (state !== 'playing') return;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function moveBasketTo(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    let x = (clientX - rect.left) * scale - basket.w/2;
    x = Math.max(0, Math.min(W - basket.w, x));
    basket.x = x;
  }

  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    if (state === 'playing') moveBasketTo(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    if (state === 'playing') moveBasketTo(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    if (state === 'playing') moveBasketTo(e.clientX);
  });
  canvas.addEventListener('mousemove', function(e){
    if (state === 'playing' && e.buttons === 1) moveBasketTo(e.clientX);
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });

  reset();
  draw();
})();
</script>
</body>
</html>
