<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Geheugenspel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #f0f4fb;
    --panel: #ffffff;
    --text: #1d2536;
    --muted: #626e85;
    --accent: #3f6fe0;
    --cardback: #3f6fe0;
    --cardback2: #5b8bf0;
    --matched: #4dd4ac;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131c;
      --panel: #1a2030;
      --text: #eaeefb;
      --muted: #9aa6c0;
      --accent: #7ba0ff;
      --cardback: #2e3d63;
      --cardback2: #3d5080;
      --matched: #3fae8a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131c;
    --panel: #1a2030;
    --text: #eaeefb;
    --muted: #9aa6c0;
    --accent: #7ba0ff;
    --cardback: #2e3d63;
    --cardback2: #3d5080;
    --matched: #3fae8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 10px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #moves { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #board {
    position: relative;
    width: 100%;
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    padding: 3%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3%;
  }
  .card {
    aspect-ratio: 3/4;
    perspective: 600px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.35s;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    font-size: 1.8rem;
  }
  .front {
    background: linear-gradient(135deg, var(--cardback), var(--cardback2));
  }
  .back {
    background: var(--panel);
    border: 2px solid var(--accent);
    transform: rotateY(180deg);
  }
  .card.matched .back {
    border-color: var(--matched);
    background: rgba(77,212,172,0.15);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 16px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; color: #eaeefb; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
  #boardWrap { position: relative; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>🧠 Geheugenspel</h1>
    <div id="hud">
      <div>Beurten: <span id="moves">0</span></div>
      <div>Beste: <span id="best">–</span></div>
    </div>
    <div id="boardWrap">
      <div id="board"></div>
      <div id="overlay">
        <h2 id="overlayTitle">Vind alle paren</h2>
        <p id="overlayText">Tik twee kaarten om te kijken of ze bij elkaar horen. Onthoud waar ze liggen en los het op in zo min mogelijk beurten.</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Tik kaarten om ze om te draaien</div>
  </div>
</div>

<script>
(function(){
  const boardWrap = document.getElementById('boardWrap');
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');

  const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒','🍍','🥝'];
  let best = null;
  try {
    const stored = localStorage.getItem('geheugenspel-best');
    if (stored) best = parseInt(stored, 10);
  } catch(e) {}
  bestEl.textContent = best !== null ? best : '–';

  let cards, flipped, matchedCount, moves, locked, state;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildBoard() {
    board.innerHTML = '';
    const deck = shuffle([...emojis, ...emojis]);
    cards = deck.map((sym, i) => ({ sym, id: i, el: null, matched: false }));
    flipped = [];
    matchedCount = 0;
    moves = 0;
    locked = false;
    movesEl.textContent = '0';

    cards.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      const inner = document.createElement('div');
      inner.className = 'card-inner';
      const front = document.createElement('div');
      front.className = 'face front';
      front.textContent = '❔';
      const back = document.createElement('div');
      back.className = 'face back';
      back.textContent = card.sym;
      inner.appendChild(front);
      inner.appendChild(back);
      cardEl.appendChild(inner);
      board.appendChild(cardEl);
      card.el = cardEl;

      cardEl.addEventListener('touchstart', function(e){ e.preventDefault(); tap(card); }, { passive:false });
      cardEl.addEventListener('mousedown', function(){ tap(card); });
    });
  }

  function tap(card) {
    if (state !== 'playing') return;
    if (locked || card.matched || flipped.includes(card)) return;
    card.el.classList.add('flipped');
    flipped.push(card);
    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = String(moves);
      locked = true;
      const [a,b] = flipped;
      if (a.sym === b.sym) {
        a.matched = b.matched = true;
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        matchedCount += 2;
        flipped = [];
        locked = false;
        if (matchedCount === cards.length) {
          setTimeout(win, 400);
        }
      } else {
        setTimeout(() => {
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 700);
      }
    }
  }

  function win() {
    state = 'over';
    if (best === null || moves < best) {
      best = moves;
      bestEl.textContent = best;
      try { localStorage.setItem('geheugenspel-best', String(best)); } catch(e) {}
    }
    overlayTitle.textContent = 'Opgelost! 🎉';
    overlayText.textContent = 'Je deed het in ' + moves + ' beurten  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    buildBoard();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });

  state = 'ready';
  buildBoard();
})();
</script>
</body>
</html>
