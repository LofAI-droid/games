<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Kleurenreeks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #f2f0f7;
    --panel: #ffffff;
    --text: #201d2b;
    --muted: #66627a;
    --accent: #6c4fe0;
    --ring: #d8d2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14121c;
      --panel: #1e1b2b;
      --text: #efedf7;
      --muted: #a49ec0;
      --accent: #9a7bff;
      --ring: #322c47;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14121c;
    --panel: #1e1b2b;
    --text: #efedf7;
    --muted: #a49ec0;
    --accent: #9a7bff;
    --ring: #322c47;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 400px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 10px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #level { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #board {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 20px;
    background: var(--panel);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    padding: 5%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4%;
  }
  .pad {
    border-radius: 18px;
    opacity: 0.55;
    transition: opacity 0.1s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pad.active { opacity: 1; transform: scale(0.96); }
  #p0 { background: #ff6b6b; border-radius: 18px 6px 6px 6px; }
  #p1 { background: #ffd93d; border-radius: 6px 18px 6px 6px; }
  #p2 { background: #4dd4ac; border-radius: 6px 6px 6px 18px; }
  #p3 { background: #5b8bf0; border-radius: 6px 6px 18px 6px; }
  #centerLabel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 34%;
    aspect-ratio: 1/1;
    background: var(--panel);
    border: 3px solid var(--ring);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--text);
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 20px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; color: #efedf7; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>🎨 Kleurenreeks</h1>
    <div id="hud">
      <div>Level: <span id="level">0</span></div>
      <div>Beste: <span id="best">0</span></div>
    </div>
    <div id="board">
      <div class="pad" id="p0"></div>
      <div class="pad" id="p1"></div>
      <div class="pad" id="p2"></div>
      <div class="pad" id="p3"></div>
      <div id="centerLabel">Kijk</div>
      <div id="overlay">
        <h2 id="overlayTitle">Onthoud de reeks</h2>
        <p id="overlayText">Kijk naar de volgorde en tik hem na. Elke ronde wordt hij langer.</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Kijk goed en tik de kleuren in de juiste volgorde</div>
  </div>
</div>

<script>
(function(){
  const pads = [
    document.getElementById('p0'),
    document.getElementById('p1'),
    document.getElementById('p2'),
    document.getElementById('p3')
  ];
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');
  const centerLabel = document.getElementById('centerLabel');

  let best = 0;
  try {
    const stored = localStorage.getItem('kleurenreeks-best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch(e) {}
  bestEl.textContent = best;

  const freqs = [220, 277, 330, 392];
  let audioCtx = null;
  function beep(idx, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = freqs[idx];
      o.type = 'sine';
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur/1000));
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + (dur/1000));
    } catch(e) {}
  }

  let sequence = [];
  let playerStep = 0;
  let state = 'ready'; // ready | showing | input | over
  let level = 0;

  function flash(idx, dur) {
    return new Promise(resolve => {
      const pad = pads[idx];
      pad.classList.add('active');
      beep(idx, dur);
      setTimeout(() => {
        pad.classList.remove('active');
        setTimeout(resolve, 90);
      }, dur);
    });
  }

  async function playSequence() {
    state = 'showing';
    centerLabel.textContent = 'Kijk';
    const dur = Math.max(280, 480 - level * 10);
    await new Promise(r => setTimeout(r, 400));
    for (let i = 0; i < sequence.length; i++) {
      await flash(sequence[i], dur);
    }
    playerStep = 0;
    state = 'input';
    centerLabel.textContent = 'Tik';
  }

  function nextRound() {
    level++;
    levelEl.textContent = String(level);
    sequence.push(Math.floor(Math.random() * 4));
    playSequence();
  }

  function startGame() {
    sequence = [];
    level = 0;
    levelEl.textContent = '0';
    overlay.classList.add('hidden');
    nextRound();
  }

  function padTapped(idx) {
    if (state !== 'input') return;
    flash(idx, 200);
    if (sequence[playerStep] === idx) {
      playerStep++;
      if (playerStep === sequence.length) {
        state = 'between';
        centerLabel.textContent = '✓';
        setTimeout(nextRound, 700);
      }
    } else {
      endGame();
    }
  }

  function endGame() {
    state = 'over';
    if (level - 1 > best) {
      best = level - 1;
      bestEl.textContent = best;
      try { localStorage.setItem('kleurenreeks-best', String(best)); } catch(e) {}
    }
    overlayTitle.textContent = 'Fout!';
    overlayText.textContent = 'Je haalde level ' + Math.max(0, level-1) + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
    centerLabel.textContent = '✕';
  }

  pads.forEach((pad, i) => {
    pad.addEventListener('touchstart', function(e){ e.preventDefault(); padTapped(i); }, { passive: false });
    pad.addEventListener('mousedown', function(){ padTapped(i); });
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
})();
</script>
</body>
</html>
