<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Tik de Moltjes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #eef6ec;
    --panel: #ffffff;
    --text: #1e2b1c;
    --muted: #5c6d58;
    --accent: #3c9a4a;
    --accent2: #e0752f;
    --hole: #6b4a2f;
    --hole-dark: #4a3220;
    --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10160f;
      --panel: #1a231a;
      --text: #eaf3e8;
      --muted: #9db299;
      --accent: #5cc46b;
      --accent2: #ff9152;
      --hole: #3a2a1c;
      --hole-dark: #241a11;
      --bad: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10160f;
    --panel: #1a231a;
    --text: #eaf3e8;
    --muted: #9db299;
    --accent: #5cc46b;
    --accent2: #ff9152;
    --hole: #3a2a1c;
    --hole-dark: #241a11;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 12px;
  }
  #wrap { width: 100%; max-width: 440px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px 2px; font-weight: 700; }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 10px 2px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  #timeWrap {
    background: rgba(0,0,0,0.08);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-top: 4px;
  }
  #timeBar {
    height: 100%;
    background: var(--accent2);
    width: 100%;
    transition: width 0.1s linear;
  }
  #board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4%;
    padding: 5%;
  }
  .hole {
    position: relative;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, var(--hole-dark) 0%, var(--hole) 60%, transparent 62%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: visible;
  }
  .mole {
    width: 62%;
    height: 62%;
    border-radius: 50% 50% 46% 46%;
    background: var(--accent2);
    transform: translateY(105%);
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    cursor: pointer;
  }
  .hole.up .mole { transform: translateY(8%); }
  .hole.bad .mole { background: var(--bad); }
  .hole.hit .mole { transform: translateY(105%) scale(0.7); transition: transform 0.12s ease-in; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; }
  #overlay p { margin: 0; color: #eaf3e8; font-size: 0.95rem; }
  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
  #footer { margin-top: 10px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <h1>🐹 Tik de Moltjes</h1>
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Beste: <span id="best">0</span></div>
    </div>
    <div id="timeWrap"><div id="timeBar"></div></div>
    <br>
    <div id="board" style="position:relative;">
      <div id="overlay">
        <h2 id="overlayTitle">Tik de moltjes!</h2>
        <p id="overlayText">30 seconden. Tik oranje moltjes voor punten, vermijd de rode!</p>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div id="footer">Tik de oranje moltjes zo snel mogelijk</div>
  </div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const timeBar = document.getElementById('timeBar');

  const N = 9;
  let holes = [];
  let best = 0;
  try {
    const stored = localStorage.getItem('tikdemoltjes-best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch(e) {}
  bestEl.textContent = best;

  let score = 0;
  let state = 'ready';
  let duration = 30000;
  let startTime = 0;
  let popTimer = null;
  let tickTimer = null;

  // build holes
  for (let i = 0; i < N; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const mole = document.createElement('div');
    mole.className = 'mole';
    mole.textContent = '🐹';
    hole.appendChild(mole);
    board.appendChild(hole);
    holes.push({ el: hole, mole: mole, up: false, bad: false, timeout: null });

    hole.addEventListener('touchstart', function(e){
      e.preventDefault();
      whack(i);
    }, { passive: false });
    hole.addEventListener('mousedown', function(){ whack(i); });
  }

  function whack(i) {
    if (state !== 'playing') return;
    const h = holes[i];
    if (!h.up) return;
    h.up = false;
    h.el.classList.remove('up');
    h.el.classList.add('hit');
    if (h.bad) {
      score = Math.max(0, score - 3);
    } else {
      score += 1;
    }
    scoreEl.textContent = String(score);
    clearTimeout(h.timeout);
    setTimeout(() => h.el.classList.remove('hit', 'bad'), 150);
  }

  function popRandom() {
    if (state !== 'playing') return;
    const idle = holes.map((h,i)=>({h,i})).filter(o => !o.h.up);
    if (idle.length === 0) return scheduleNextPop();
    const pick = idle[Math.floor(Math.random()*idle.length)];
    const h = pick.h;
    const isBad = Math.random() < 0.25;
    h.up = true;
    h.bad = isBad;
    h.el.classList.toggle('bad', isBad);
    h.el.classList.add('up');
    const elapsed = performance.now() - startTime;
    const progress = Math.min(1, elapsed / duration);
    const upTime = 900 - progress * 500 + Math.random()*250;
    h.timeout = setTimeout(() => {
      h.up = false;
      h.el.classList.remove('up');
    }, Math.max(350, upTime));
    scheduleNextPop();
  }

  function scheduleNextPop() {
    if (state !== 'playing') return;
    const elapsed = performance.now() - startTime;
    const progress = Math.min(1, elapsed / duration);
    const delay = 650 - progress * 350 + Math.random()*200;
    popTimer = setTimeout(popRandom, Math.max(220, delay));
  }

  function tick() {
    if (state !== 'playing') return;
    const elapsed = performance.now() - startTime;
    const remaining = Math.max(0, duration - elapsed);
    timeBar.style.width = (remaining / duration * 100) + '%';
    if (remaining <= 0) {
      endGame();
      return;
    }
    tickTimer = requestAnimationFrame(tick);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = '0';
    holes.forEach(h => {
      h.up = false; h.bad = false;
      h.el.classList.remove('up','bad','hit');
      clearTimeout(h.timeout);
    });
    state = 'playing';
    overlay.classList.add('hidden');
    startTime = performance.now();
    timeBar.style.width = '100%';
    scheduleNextPop();
    tick();
  }

  function endGame() {
    state = 'over';
    clearTimeout(popTimer);
    holes.forEach(h => { h.up = false; h.el.classList.remove('up'); clearTimeout(h.timeout); });
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('tikdemoltjes-best', String(best)); } catch(e) {}
    }
    overlayTitle.textContent = 'Tijd om!';
    overlayText.textContent = 'Score: ' + score + '  •  Beste: ' + best;
    startBtn.textContent = 'Opnieuw';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
})();
</script>
</body>
</html>
